name: scoring-service

on:
  push:
    branches: [main]
    paths:
      - "scoring-service/**"
      - ".github/workflows/scoring-service.yml"
  pull_request:
    paths:
      - "scoring-service/**"
      - ".github/workflows/scoring-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoring-service

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scoring-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
