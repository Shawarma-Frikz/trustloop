spring.application.name=trustloop-api
spring.application.version=${TRUSTLOOP_API_VERSION:0.0.1-SNAPSHOT}
server.address=127.0.0.1
server.port=8080

trustloop.scoring.url=${TRUSTLOOP_SCORING_URL:http://127.0.0.1:8000}
trustloop.scoring.token=${TRUSTLOOP_SCORING_TOKEN:}
trustloop.scoring.expected-model-version=${TRUSTLOOP_EXPECTED_MODEL_VERSION:tl-text-1.1.0}
trustloop.api.rate-limit-per-minute=${TRUSTLOOP_RATE_LIMIT_PER_MINUTE:60}
trustloop.allowed-origins=${TRUSTLOOP_ALLOWED_ORIGINS:}
spring.jackson.deserialization.fail-on-unknown-properties=true
